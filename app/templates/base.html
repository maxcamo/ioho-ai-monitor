<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta http-equiv="refresh" content="45"/>
<title>{% block title %}IOHO AI Monitor{% endblock %}</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#0b1120;--panel:#111c30;--line:#24334d;--dim:#94a6c0;--fg:#e9f1ff;--blue:#75b8ff;--green:#49d6a4;--amber:#ffcc6f;--red:#fa7282}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);line-height:1.45}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.topbar{height:66px;border-bottom:1px solid var(--line);background:#0f1829;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1200px)/2));gap:20px}.brand{font-weight:750;letter-spacing:.04em;color:#fff}.brand small{font-weight:500;color:var(--dim)}.topbar nav{display:flex;gap:22px}.topbar nav a{color:var(--dim)}main{max-width:1200px;margin:auto;padding:32px 20px 64px}.sub{color:var(--dim);font-size:.88rem}.split{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:1.65rem;letter-spacing:-.03em;margin:0 0 6px}h2{font-size:1.12rem;margin:0 0 16px}h3{font-size:.98rem;margin:0 0 9px}p{margin:7px 0 12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:26px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:2rem;display:block;font-variant-numeric:tabular-nums}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:18px 0;overflow-x:auto}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;padding:3px 9px;border-radius:999px;font-size:.73rem;text-transform:uppercase;letter-spacing:.04em;font-weight:650}.ok{color:var(--green)}.warning{color:var(--amber)}.critical{color:var(--red)}.unknown{color:var(--dim)}.table{width:100%;border-collapse:collapse;min-width:700px}.table td,.table th{border-bottom:1px solid var(--line);padding:12px 9px;text-align:left;font-size:.88rem;vertical-align:top}.table th{color:var(--dim);font-weight:550}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#15233a}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.83rem;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.inner{background:#0e192c;border-radius:10px;padding:16px;min-width:0}.number{font-weight:750;font-size:1.8rem}.error{color:var(--red)}ul,ol{padding-left:20px;margin:10px 0}li{padding:3px 0;overflow-wrap:anywhere}.eyebrow{letter-spacing:.1em;text-transform:uppercase;font-size:.72rem;color:var(--dim)}.breadcrumb{margin-bottom:20px;color:var(--dim);font-size:.9rem}.break{overflow-wrap:anywhere}.foot{font-size:.79rem;color:var(--dim);margin-top:24px;border-top:1px solid var(--line);padding-top:16px}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr 1fr}.stat{padding:12px}.topbar{padding:0 15px}.topbar nav{gap:8px}.topbar nav a{font-size:.8rem}main{padding:20px 12px}.panel{padding:15px}.table{min-width:540px}}@media(max-width:440px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.brand small{display:none}}

.log-section{margin-bottom:12px}.log-section .split{margin-bottom:10px}.log-section h3{margin:0}
.log-group{border-top:1px solid var(--line);padding:0 2px}.log-group summary{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;cursor:pointer;list-style:none}.log-group summary::-webkit-details-marker{display:none}.log-group summary::before{content:"▸";color:var(--blue);flex:none}.log-group[open] summary::before{content:"▾"}.log-signature{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.84rem;overflow-wrap:anywhere;flex:1;min-width:0}.log-expanded{padding:4px 9px 15px 24px}.log-expanded h4{font-size:.83rem;font-weight:600;margin:12px 0 8px}.log-example{border-left:2px solid var(--line);padding-left:10px;margin:11px 0}.log-example pre{white-space:pre-wrap;word-break:break-word;margin:6px 0;font-size:.79rem;color:var(--dim)}

.ranked-errors{min-width:870px;margin-top:18px}.ranked-errors thead th:first-child{width:42%}.ranked-errors thead th:not(:first-child){text-align:center}.ranked-errors .error-row-cell{padding:0!important}.ranked-error summary{display:grid;grid-template-columns:minmax(270px,3.3fr) repeat(4,minmax(78px,1fr)) minmax(105px,1.15fr);align-items:center;gap:10px;padding:13px 9px;cursor:pointer;list-style:none}.ranked-error summary::-webkit-details-marker{display:none}.ranked-error summary:hover{background:#15233a}.ranked-error[open] summary{background:#18273f}.ranked-error .err-title{min-width:0;overflow-wrap:anywhere;font-weight:540;padding-left:20px;position:relative}.ranked-error .err-title::before{content:'▸';color:var(--blue);position:absolute;left:1px}.ranked-error[open] .err-title::before{content:'▾'}.ranked-error .err-number{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}.ranked-error summary>span:last-child{text-align:center}.ranked-error .err-detail{padding:16px 25px 20px;background:#0d182a;border-top:1px solid var(--line)}.ranked-error .err-detail h4{margin:12px 0;font-size:.9rem}.error-table-wrap{overflow-x:auto}.ranked-error pre{max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap;word-break:break-word}

.traffic-period{border-top:1px solid var(--line);margin-top:12px}
.traffic-period>summary{cursor:pointer;padding:15px 0;list-style:none;color:var(--blue)}
.traffic-period>summary::-webkit-details-marker{display:none}
.traffic-period>summary::before{content:"▸ ";color:var(--blue)}
.traffic-period[open]>summary::before{content:"▾ "}
.traffic-period-body{padding-bottom:16px}
.traffic-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.traffic-stats .inner{padding:13px}
.traffic-table{min-width:0}
.traffic-table td,.traffic-table th{font-size:.77rem;padding:7px 5px}
@media(max-width:850px){.traffic-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){.traffic-stats{grid-template-columns:1fr 1fr}}

.analysis-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.analysis-actions form{margin:0}
.analysis-btn{background:#1a4271;border:1px solid #3979b2;border-radius:9px;color:#f4f9ff;padding:10px 13px;font:inherit;font-size:.88rem;font-weight:650;cursor:pointer}
.analysis-btn:hover{background:#27558b}
.analysis-btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.analysis-btn.compact{padding:6px 9px;font-size:.76rem}

/* Status distinti per report applicativi e traffico, leggibili anche da mobile */
.domain-overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:25px 0}
.domain-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.domain-box h2{margin:8px 0 16px;font-size:1.2rem}
.status-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.status-counts strong{display:block;font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}
.status-counts small{color:var(--dim);font-size:.73rem}
.domain-table{min-width:850px;table-layout:fixed}
.domain-table th:first-child{width:27%}.domain-table th:nth-child(2),.domain-table th:nth-child(3){width:36.5%}
.domain-table td{padding:16px 12px}
.domain-table .server-health{margin-top:12px;font-size:.83rem}
.domain-table .domain-cell{background:rgba(9,17,30,.22)}
.domain-cell .domain-result,.inner .domain-result{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:10px}
.domain-cell .domain-summary{display:block;font-size:.86rem;line-height:1.4;margin-bottom:6px;max-width:38ch;overflow-wrap:anywhere}
.domain-cell .domain-action{margin-top:12px}
/* Home v0.10: badge, timestamp discreto e bottone; dettagli solo nel report. */
.domain-cell .domain-updated{color:var(--dim);font-size:.71rem;line-height:1.35;margin-top:5px;font-variant-numeric:tabular-nums}
.domain-cell .domain-action{margin-top:9px}

.domain-cell .domain-action button{max-width:100%;white-space:normal;text-align:center}
.status-table-wrap{overflow-x:auto}
@media(max-width:800px){.domain-overview{grid-template-columns:1fr}.domain-table{min-width:730px}}
@media(max-width:480px){.status-counts{gap:6px}.status-counts strong{font-size:1.4rem}}

/* Report operativo HTTP v0.7: prioritizza IP, pagine e ritmo, senza duplicati. */
.http-report{scroll-margin-top:20px}
.http-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.http-kpi{background:#0c1a30;border:1px solid var(--line);border-radius:11px;padding:13px;min-width:0}
.http-kpi>span{display:block;color:var(--dim);font-size:.78rem}
.http-kpi strong{display:block;font-size:1.6rem;margin:3px 0;font-variant-numeric:tabular-nums}
.http-kpi small{font-size:.75rem;color:var(--dim)}
.http-findings{border:1px solid var(--line);background:#0e1a2d;border-radius:12px;padding:16px;margin-bottom:15px}
.http-findings h3{font-size:1rem;margin:0 0 5px}
.http-findings li{margin:2px 0;line-height:1.45}
.http-alert{border-left:4px solid var(--amber);padding:12px;background:#2a231e;color:#ffdaa3;margin:14px 0;border-radius:6px}
.http-jump{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.http-jump a{border:1px solid #40628b;border-radius:30px;padding:6px 10px;font-size:.78rem}
.http-block{scroll-margin-top:16px;padding:14px 0 20px;border-top:1px solid var(--line);min-width:0}
.http-block h3{font-size:1rem;margin:0 0 9px}
.http-scroll{width:100%;overflow-x:auto}
.http-table{min-width:0;width:100%}
.http-table td,.http-table th{font-size:.82rem;padding:9px 7px}
.http-table th{white-space:nowrap}
.http-table tbody tr:nth-child(even){background:#0d1b30}
.http-table td:first-child{font-variant-numeric:tabular-nums}
.http-path{overflow-wrap:anywhere;word-break:break-word;max-width:370px}
.http-iplookup{display:inline-block;margin:2px 0 0 4px;border:1px solid #395f8c;border-radius:5px;padding:2px 6px;font-size:.74rem;white-space:nowrap;color:#a9d3ff}
.http-iplookup:hover{background:#244268;text-decoration:none}
#http-subnets{scroll-margin-top:16px}
.http-path:not(:last-child){margin-bottom:4px}
.http-track{height:5px;border-radius:4px;background:#1c304a;overflow:hidden;min-width:65px;margin-top:5px}
.http-track span{display:block;height:100%;background:var(--blue)}
.http-two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.http-chart{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.http-barline{display:grid;grid-template-columns:52px 1fr 50px;gap:8px;align-items:center;font-size:.78rem}
.http-barline strong{text-align:right;font-variant-numeric:tabular-nums}
.http-bar{height:12px;background:#1b2d47;border-radius:3px;overflow:hidden}
.http-bar i{display:block;height:100%;background:#69a8ec;border-radius:3px}
.status-report-link{display:inline-flex;text-decoration:none!important;cursor:pointer}
.status-report-link:hover{filter:brightness(1.2);background:rgba(115,184,255,.1)}
.status-report-link:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.http-cpu-block{background:#0c192b;border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
.http-cpu-block h3{margin:0 0 12px}
.http-cpu-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 16px}
.http-cpu-kpis>div{background:#101f36;border-radius:8px;padding:10px}
.http-cpu-kpis strong{display:block;font-size:1.35rem;margin:4px 0;font-variant-numeric:tabular-nums}
.http-cpu-table{margin-top:12px}
.http-cpu-table .http-bar{min-width:90px;width:100%}
.http-cpu-bar i{background:#e4b564}
@media(max-width:700px){.http-cpu-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.http-details{border-top:1px solid var(--line);padding:12px 0}
.http-details summary{cursor:pointer;color:var(--blue);font-weight:650}
@media(max-width:850px){.http-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.http-two{grid-template-columns:1fr}}
@media(max-width:600px){.http-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.http-table{min-width:500px}.http-kpi strong{font-size:1.35rem}}
</style></head><body>
<header class="topbar"><a class="brand" href="/">IOHO <small>AI Monitor</small></a><nav><a href="/">Panoramica</a><a href="/">Server e incidenti</a></nav></header>
<main>{% block content %}{% endblock %}<div class="foot">IOHO AI Monitor · diagnosi assistita, non interventi automatici. Dati aggiornati ogni 45 secondi. L'assenza di evidenze non esclude incidenti.</div></main>
</body></html>

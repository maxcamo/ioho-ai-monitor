services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ioho_monitor
      POSTGRES_USER: ioho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioho -d ioho_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ioho:${POSTGRES_PASSWORD}@db:5432/ioho_monitor
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8000"
    networks: [internal]
  worker:
    build: .
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ioho:${POSTGRES_PASSWORD}@db:5432/ioho_monitor
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
volumes:
  pg_data:
networks:
  internal:
    driver: bridge
